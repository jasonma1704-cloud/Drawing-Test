{% extends "base.html" %}
{% block content %}
<div class="card p-4">
  <h4 class="mb-3">任务列表</h4>
  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>邮件主题</th>
          <th>发件人</th>
          <th>附件数</th>
          <th>状态</th>
          <th>飞书</th>
          <th>更新时间</th>
        </tr>
      </thead>
      <tbody>
      {% for task in tasks %}
        <tr>
          <td><a href="/tasks/{{ task.id }}">{{ task.id }}</a></td>
          <td>{{ task.email_subject }}</td>
          <td>{{ task.sender }}</td>
          <td>{{ task.attachment_count }}</td>
          <td>{{ task.status }}</td>
          <td>{{ "是" if task.feishu_sent else "否" }}</td>
          <td class="mono">{{ task.updated_at }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
