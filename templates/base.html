<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ settings.app_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f7fb; }
    .card { border: 0; box-shadow: 0 6px 18px rgba(19, 33, 68, 0.07); }
    .badge-soft { background: #e8f4ff; color: #0d6efd; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .navbar { box-shadow: 0 2px 12px rgba(0,0,0,.05); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="/">AI Mail Workflow</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/tasks">任务</a>
      <a class="nav-link" href="/settings">配置</a>
      <a class="nav-link" href="/api/health">健康检查</a>
    </div>
  </div>
</nav>
<div class="container-fluid px-4 pb-5">
  {% block content %}{% endblock %}
</div>
</body>
</html>
